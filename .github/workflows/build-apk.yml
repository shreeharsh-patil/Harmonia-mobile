name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: harmonia-phone-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      # Public runtime endpoints bundled into the APK. Spotify client secrets
      # stay only in the backend's Vercel environment.
      EXPO_PUBLIC_HARMONIA_API_URL: https://harmonia-mobile-backend.vercel.app
      EXPO_PUBLIC_HARMONIA_STREAM_API_URL: https://harmonia-mobile-backend.vercel.app
      EXPO_PUBLIC_SPOTIFY_CANVAS_API_URL: https://spotify-canvas-one.vercel.app/api/canvas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Verify Expo Android autolinking
        working-directory: android
        run: |
          # Run Expo's inline-module mirror before Gradle loads its JVMs. This
          # surfaces the real CLI error and prepares the generated empty list.
          node --no-warnings --eval "require('expo/bin/autolinking')" \
            expo-modules-autolinking mirror-kotlin-inline-modules \
            --kotlin-files-mirror-directory "$GITHUB_WORKSPACE/node_modules/expo/android/src/main/java/inline/modules" \
            --inline-modules-list-directory "$GITHUB_WORKSPACE/node_modules/expo/android/build/inline/modules" \
            --watched-directories-serialized '[]'

      - name: Avoid redundant Expo inline-module discovery
        run: node scripts/patch-expo-inline-autolinking.mjs

      - name: Tune Gradle memory for the release build
        run: |
          # Keep compilation in one bounded JVM. Separate Gradle and Kotlin
          # daemons exhaust the 7 GB hosted runner before Expo invokes Node.
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=1
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Phone releases do not need emulator ABIs. Building only ARM cuts
          # native compilation substantially and keeps the release APK focused
          # on actual Android devices.
          ./gradlew assembleRelease --no-daemon --build-cache --stacktrace \
            --max-workers=1 \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Harmonia-mobile.apk
          ls -lh Harmonia-mobile.apk

      - name: Publish phone-install release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view phone-build >/dev/null 2>&1; then
            gh release delete phone-build --yes --cleanup-tag
          fi
          gh release create phone-build Harmonia-mobile.apk \
            --target "${GITHUB_SHA}" \
            --title "Harmonia Mobile 0.3.5 APK" \
            --notes "Harmonia Mobile 0.3.5 standalone Android APK. Includes the refreshed Harmonia login/performance work, dynamic India chart updates, player and lyrics polish, and the Home quick-access fix so recently opened or played playlists appear beside Liked Songs. Download Harmonia-mobile.apk on your Android phone and install it."

