name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: harmonia-phone-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Harmonia-mobile.apk
          ls -lh Harmonia-mobile.apk

      - name: Publish phone-install release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view phone-build >/dev/null 2>&1; then
            gh release delete phone-build --yes --cleanup-tag
          fi
          gh release create phone-build Harmonia-mobile.apk \
            --target "${GITHUB_SHA}" \
            --title "Harmonia Mobile APK" \
            --notes "Standalone Android APK built from the current main branch. Download Harmonia-mobile.apk on your Android phone and install it."

