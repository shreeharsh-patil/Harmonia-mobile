name: Publish production app update

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonia-eas-update
  cancel-in-progress: true

jobs:
  publish-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_HARMONIA_API_URL: https://harmonia-mobile-backend.vercel.app
      EXPO_PUBLIC_HARMONIA_STREAM_API_URL: https://harmonia-mobile-backend.vercel.app
      EXPO_PUBLIC_SPOTIFY_CANVAS_API_URL: https://spotify-canvas-one.vercel.app/api/canvas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Android over-the-air update
        run: |
          # EXPO_TOKEN is deliberately kept in GitHub Actions secrets, never
          # in the repository or APK. A missing token is a safe no-op.
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured; skipping OTA publication."
            exit 0
          fi
          npx eas-cli@24.7.0 update \
            --channel production \
            --environment production \
            --platform android \
            --non-interactive \
            --message "${{ github.sha }}"
