name: Repair Expo dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-playlist-load.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Install current dependency graph
        run: npm ci --no-audit --no-fund
      - name: Align packages with Expo SDK 57
        run: npx expo install --fix
      - name: Align package metadata with app version
        run: npm version 0.3.5 --no-git-tag-version --allow-same-version
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Commit repaired dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependencies already compatible'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: align Expo SDK dependencies'
          git push origin HEAD:main
